name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS is the supported platform today. Linux and Windows run so we see problems early;
    # a Windows failure doesn't block a merge yet (help wanted, see CONTRIBUTING.md).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ShootDrop.slnx
      - name: Build
        run: dotnet build ShootDrop.slnx --no-restore -c Release
      - name: Test
        run: dotnet test ShootDrop.slnx --no-build -c Release --logger "console;verbosity=normal"
