name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ShootDrop.slnx
      - name: Build
        run: dotnet build ShootDrop.slnx --no-restore -c Release
      - name: Test
        run: dotnet test ShootDrop.slnx --no-build -c Release --logger "console;verbosity=normal"
