name: release

# Push a tag like v0.2.0 (or create the release on GitHub) and this builds ShootDrop and attaches
# exactly four downloads to the GitHub Release:
#   ShootDrop-macOS-Apple-Silicon.dmg, ShootDrop-macOS-Intel.dmg, ShootDrop-Windows.exe, ShootDrop-Linux.tar.gz
# The names carry no version, so the README's /releases/latest/download/... links always give the newest build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test ShootDrop.slnx -c Release

  macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            name: ShootDrop-macOS-Apple-Silicon.dmg
          - rid: osx-x64
            name: ShootDrop-macOS-Intel.dmg
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build ShootDrop.app
        run: |
          dotnet publish src/ShootDrop.App -c Release -r ${{ matrix.rid }} --self-contained true -o out/app -p:Version=$VERSION
          scripts/macos/package-app.sh out/app out/dmg/ShootDrop.app "$VERSION"
      - name: Make the .dmg (drag to Applications)
        run: |
          ln -s /Applications out/dmg/Applications
          mkdir -p dist
          hdiutil create -volname "ShootDrop" -srcfolder out/dmg -ov -format UDZO "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build one .exe
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          dotnet publish src/ShootDrop.App -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${TAG#v} -o out
          mkdir -p dist && cp out/ShootDrop.exe dist/ShootDrop-Windows.exe
      - uses: actions/upload-artifact@v5
        with:
          name: dist-win-x64
          path: dist/*

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          dotnet publish src/ShootDrop.App -c Release -r linux-x64 --self-contained true -p:Version=${TAG#v} -o out/ShootDrop
          mkdir -p dist && tar -czf dist/ShootDrop-Linux.tar.gz -C out ShootDrop
      - uses: actions/upload-artifact@v5
        with:
          name: dist-linux-x64
          path: dist/*

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Attach the four downloads (and remove anything else)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -la dist
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "ShootDrop $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          keep=" $(cd dist && ls | tr '\n' ' ') "
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r a; do
            case "$keep" in *" $a "*) ;; *) gh release delete-asset "$TAG" "$a" -y -R "$GITHUB_REPOSITORY" ;; esac
          done
